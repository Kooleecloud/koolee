# Shared start: leave any task screen so the tab bar is showing. Every
# screen-level flow runs this first, so a flow that stopped half-way on a
# task screen never breaks the next one. REPEATED, because deep links stack
# task screens: a visit opened on top of a pickup backs out to the pickup.
appId: cloud.koolee.driver
---
- repeat:
    times: 5
    while:
      visible:
        id: "task-screen"
    commands:
      - scrollUntilVisible:
          element:
            id: "task-back"
          direction: UP
          timeout: 15000
      - tapOn:
          id: "task-back"
